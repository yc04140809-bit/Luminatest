# MUGEN ZERO — Android Debug APK（App版）
#
# 実機確認用のDebug APKをGitHub Actions上で生成します。
#
# これは **mugen-app** の APK です。
#   もう一つの android-debug-apk.yml は mugen-artifact の APK を作ります。
#   開発の中心は mugen-app なので、ステータス画面・命名画面など新しい
#   実装が入っているのはこちらです。
#
#   アプリケーションIDが違う（app = com.mugenzero.app /
#   artifact = com.mugenzero.alpha）ので、1台の端末に両方入れて
#   見比べられます。片方を入れても、もう片方のセーブは消えません。
#
# なぜCIで作るのか:
#   Androidのビルドには Android SDK と、Googleのサーバー(dl.google.com)
#   から取得する Android Gradle Plugin が必要です。開発用のサンドボックス
#   からは dl.google.com へ接続できないため(403)、SDKが標準搭載されていて
#   ネットワーク制限のない GitHub の ubuntu ランナー上でビルドします。
#
# これは「開発用のDebug APK」です。
#   Play Store 公開用の署名は行いません。Androidが自動生成するdebug鍵で
#   署名されるため、端末に入れるには「提供元不明のアプリ」の許可が要ります。
#
# 2種類を同時に作ります（2026-10-30 タスクF: 製品版／提出用ではデバッグUIを出さない）:
#   debug     … デモ・開発用。DEBUG ボタンなどのデバッグ用の道具あり（npm run build:debug）。
#   showcase  … 製品版・提出用。リリース用のビルド（npm run build）で、DEBUG ボタン・
#               DEBUG メニュー・?preview= などの開発用の入口はビルドの段階で入らない
#               （check:release で確認）。署名は debug と同じく Android の debug 鍵。
#   どちらもアプリIDは com.mugenzero.app（同じ枠）なので、端末にはどちらか一方を入れます。
#   手動実行では、作る種類を選べます（既定は両方）。
#
# 生成物の受け取り方:
#   Actions のこのワークフローの実行結果を開き、ページ下部の Artifacts から
#   mugen-zero-app-debug-apk（デバッグ用）または mugen-zero-app-showcase-apk
#   （製品版・提出用）をダウンロードします(スマホのブラウザで可)。
name: Android Debug APK (App)

on:
  # 手動実行。スマホのGitHubサイトからでも押せます。
  workflow_dispatch:
    inputs:
      variant:
        description: '作る種類（both = 両方／debug = デバッグ用の道具あり／showcase = 製品版・提出用）'
        type: choice
        options: [both, debug, showcase]
        default: both
  push:
    branches:
      - claude/mugen-zero-v01-implementation-qanh8u
    paths:
      - 'packages/mugen-app/**'
      - 'packages/mugen-core/**'
      - 'packages/mugen-assets/**'
      - 'packages/shared-aliases.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug-apk-app.yml'

# 同じブランチで走っている古いビルドは打ち切る。APKは最新の1つで足りる。
concurrency:
  group: android-app-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    # push では両方。手動実行では選んだ種類だけ（job の if では matrix を読めないので、組み合わせ自体を作り分ける）。
    strategy:
      fail-fast: false
      # 1つずつ（debug が先）。最初の実行で debug が作った署名の鍵を、showcase も使うため（下の「署名の鍵」）。
      max-parallel: 1
      matrix:
        variant: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.variant != 'both') && format('["{0}"]', inputs.variant) || '["debug","showcase"]') }}
    name: APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ブラウザは要らない。Playwrightのダウンロードを止めて数分節約する。
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Capacitor 8 のテンプレートは Java 21 / AGP 8.13 / compileSdk 36。
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `packages` の既定値は `tools platform-tools` だが、`tools` は
          # 廃止済みで cmdline-tools 16 のリポジトリには存在しない。
          # action はそれを入れようとして
          #   Warning: Failed to find package 'tools'
          #   Error: sdkmanager failed with exit code 1
          # で落ちる。ここではライセンス承諾だけを任せ、必要なものは
          # 次の step で明示的に入れる。
          packages: ''

      # AGP 8.13 / compileSdk 36 に必要な2つだけ。バージョンを固定するのは、
      # 取得に失敗したときログにパッケージ名がそのまま出るようにするため。
      - name: SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -r | head -n1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi
          echo "using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      # 署名の鍵（2026-10-30: 実機で「アプリはインストールされていません」）。debug 鍵は Gradle が
      # ~/.android/debug.keystore に無ければ作るので、毎回まっさらなランナーでは APK ごとに鍵が違い、
      # 入っている版の上から新しい版を入れられなかった。1度作った鍵をキャッシュに取っておき、以後は
      # 毎回同じ鍵で署名する（上書きでき、セーブも残る）。鍵はリポジトリには置かない。
      - name: Signing key (the same every build)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mugen-app-debug-keystore-v1

      - name: Signing key (made once if there is none)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA256:" | head -n1

      # リリース用ビルドにデバッグ用の道具が入らないことの確認（入っていたら失敗）。
      - name: Release build has no debug tools
        run: npm run check:release -w @mugen/app

      # ゲーム本体。Web版と同じビルドに、デバッグ用の道具（戦闘演出プレビューと
      # タイトルの DEBUG ボタン）だけを加えたもの（.env.debug）。これはデバッグAPK
      # 専用で、リリース用の `npm run build` には含まれない。
      - name: Build the web game (debug tools on)
        if: matrix.variant == 'debug'
        run: npm run build:debug -w @mugen/app

      # 製品版・提出用: リリース用のビルド（デバッグ用の道具なし）。
      - name: Build the web game (showcase — no debug tools)
        if: matrix.variant == 'showcase'
        run: npm run build -w @mugen/app

      # dist を android/app/src/main/assets/public へ複製し、プラグインを同期。
      - name: Capacitor sync
        working-directory: packages/mugen-app
        run: npx cap sync android

      # capacitor.settings.gradle points at ../../../node_modules, i.e. the
      # WORKSPACE ROOT, because npm hoists the Capacitor packages there. If a
      # future version conflict ever un-hoists them, Gradle's error is
      # "project directory does not exist", which says nothing about why.
      # Fail here instead, where the reason is written down.
      - name: Check the native modules are where Gradle expects
        run: |
          for d in node_modules/@capacitor/android/capacitor node_modules/@capacitor/app/android node_modules/@capacitor/haptics/android; do
            if [ ! -d "$d" ]; then
              echo "::error::$d is missing. capacitor.settings.gradle resolves the native"
              echo "::error::projects from the workspace root; npm must hoist @capacitor/* there."
              exit 1
            fi
          done
          echo "native modules OK"

      - name: Assemble debug APK
        working-directory: packages/mugen-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 何が入ったAPKなのかを実行ログに残す。中身の取り違えはここで防ぐ。
      - name: APK details
        run: |
          APK=packages/mugen-app/android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "variant: ${{ matrix.variant }}"
          echo "size: $(stat -c%s "$APK") bytes"
          echo "commit: ${{ github.sha }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mugen-zero-app-${{ matrix.variant }}-apk
          path: packages/mugen-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # 90日は要らない。実機確認が終われば作り直せる。
          retention-days: 14
