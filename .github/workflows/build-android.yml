name: Build Android app (Capacitor)

# Phase19: 幸せ設計AIをCapacitor経由でAndroidアプリ(APK)としてビルドする。
# 開発サンドボックス環境ではdl.google.com(Android Gradle Pluginの取得元)への
# アクセスがネットワークポリシーでブロックされるため実機ビルドができない。
# GitHub Actionsのランナーはフルにインターネットへ到達できるため、実際の
# ビルドはこちらで行う。ビルド成果物(APK)はActionsのartifactとして
# ダウンロードできる。

on:
  push:
    branches: ["claude/koufuku-ai-phase18"]
    paths:
      - "koufuku-ai.html"
      - "img/koufuku/**"
      - "audio/koufuku/**"
      - "data/cms/**"
      - "android/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (www/) and sync into the native Android project
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: koufuku-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
